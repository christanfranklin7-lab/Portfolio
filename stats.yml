    prefix: "$"
    suffix: "M"
    label: Transition of care savings supported
  - value: 45
    suffix: " → 2"
    label: Reporting lag cut from 45 days to 2
  - value: 20
    suffix: "+"
    label: Stakeholders across business, data, and governance

