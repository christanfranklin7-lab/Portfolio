# display — the string rendered into the HTML. Always the real figure.
# count   — optional. If present, JS animates 0 → count on scroll, then
#           restores the display string. Omit for figures a count-up would
#           make nonsense of (like "45 → 2 days").

hero:
  - display: '45 <span class="arrow">&rarr;</span> 2 days'
    label: Reporting lag, cut by moving from claims data to ADT and authorization data
  - display: "$5M"
    count: 5
    prefix: "$"
    suffix: "M"
    label: Additional transition of care savings, reported by Finance
  - display: "9 products"
    label: Cloud data products in the portfolio, serving 450+ subscribers

impact:
  - display: "$5M"
    count: 5
    prefix: "$"
    suffix: "M"
    label: Additional transition of care savings reported by Finance this year (Optum)
  - display: '45 <span class="arrow">&rarr;</span> 2 days'
    label: Reporting lag, cut by moving from lagging claims data to leading ADT and authorization data (Optum)
  - display: "50 reports"
    count: 50
    suffix: " reports"
    label: Legacy reports replaced with governed data products, including 30+ SSRS reports consolidated into two dashboards (Optum)
  - display: "450+"
    count: 450
    suffix: "+"
    label: Subscribers across 9 cloud data products in the portfolio (Optum)
  - display: "3+"
    count: 3
    suffix: "+"
    label: Additional dashboards now fed by the enterprise data sets my team defines (Optum)
  - display: "98%"
    count: 98
    suffix: "%"
    label: On-time delivery achieved on data warehouse project (Optum)
  - display: "$250K"
    count: 250
    prefix: "$"
    suffix: "K"
    label: COBOL-to-SQL/.NET accounting system migration delivered with SAP integration (Valero)
