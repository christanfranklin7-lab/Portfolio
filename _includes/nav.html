<div id="mobile-menu-overlay">
  <button aria-label="Close menu" id="mobile-close-btn">&#10005;</button>
  {% for item in site.data.nav %}
  <a class="mobile-nav-link" data-mobile-nav href="{{ item.href }}">{{ item.label }}</a>
  {% endfor %}
</div>

<nav id="main-nav">
  <div class="nav-inner">
    <a class="nav-mark" href="#hero">{{ site.data.profile.initials }}</a>

    <div class="nav-links">
      {% for item in site.data.nav %}{% unless item.label == 'Contact' %}
      <a class="nav-link" data-nav-link href="{{ item.href }}">{{ item.label }}</a>
      {% endunless %}{% endfor %}
    </div>

    <a class="btn-pill btn-secondary btn-sm nav-cta" href="{{ site.data.profile.resume_url }}" download>Resume</a>

    <button aria-label="Open menu" id="mobile-menu-btn">&#9776;</button>
  </div>
</nav>
