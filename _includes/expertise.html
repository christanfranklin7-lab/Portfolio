<section id="expertise">
  <div class="wrap reveal">
    <div class="section-head">
      <p class="section-label">Core Competencies</p>
      <div class="section-rule"></div>
    </div>

    <div class="tab-row" role="tablist">
      {% for group in site.data.expertise %}
      <button class="tab-btn{% if forloop.first %} active{% endif %}" role="tab" aria-controls="panel-{{ group.id }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}" data-expertise-tab="{{ group.id }}">{{ group.label }}</button>
      {% endfor %}
    </div>

    {% for group in site.data.expertise %}
    <div class="tab-panel{% if forloop.first %} active{% endif %}" data-expertise-panel id="panel-{{ group.id }}" role="tabpanel">
      {% for item in group.items %}
      <div class="panel">
        <h4 class="panel-title">{{ item.title }}</h4>
        <p class="panel-body">{{ item.body }}</p>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</section>
