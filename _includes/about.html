<section id="about">
  <div class="wrap reveal">
    <div class="section-head">
      <p class="section-label">About</p>
      <div class="section-rule"></div>
    </div>

    <p class="lede">{{ site.data.profile.about }}</p>

    <div class="prop-grid">
      {% for prop in site.data.profile.value_props %}
      <div class="panel">
        <div class="prop-rule" aria-hidden="true"></div>
        <h3 class="panel-title">{{ prop.title }}</h3>
        <p class="panel-body">{{ prop.body }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
