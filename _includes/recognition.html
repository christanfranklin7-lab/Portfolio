<section id="recognition">
  <div class="wrap reveal">
    <div class="section-head">
      <p class="section-label">Certifications</p>
      <div class="section-rule"></div>
    </div>

    <div class="cred-grid">
      {% for cred in site.data.credentials %}
      <div class="panel">
        <div class="prop-rule" aria-hidden="true"></div>
        <h3 class="panel-title">{{ cred.title }}</h3>
        <p class="panel-body">{{ cred.issuer }}</p>
        <p class="cred-date">{{ cred.date }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
