<section id="contact">
  <div class="wrap wrap-narrow reveal contact-inner">
    <h2 class="contact-title">Let's build data products that matter</h2>
    <div class="section-rule"></div>
    <p class="section-intro">{{ site.data.profile.seeking }}</p>

    <div class="hero-ctas contact-ctas">
      <a class="btn-pill btn-primary" href="mailto:{{ site.data.profile.email }}">Get in touch</a>
      <a class="btn-pill btn-secondary" href="{{ site.data.profile.linkedin }}" target="_blank" rel="noopener noreferrer">Connect on LinkedIn</a>
      <a class="btn-pill btn-secondary" href="{{ site.data.profile.resume_url }}" download>Download resume</a>
    </div>
  </div>
</section>
