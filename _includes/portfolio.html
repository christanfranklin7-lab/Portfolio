<section id="portfolio">
  <div class="wrap wrap-narrow reveal">
    <div class="section-head">
      <p class="section-label">Featured Initiatives</p>
      <div class="section-rule"></div>
    </div>

    <div class="case-list">
      {% for project in site.data.portfolio %}
      <div class="panel case" data-accordion>
        <button class="case-trigger" data-accordion-trigger aria-expanded="false">
          <div class="case-head">
            <div class="case-head-main">
              <div class="tag-row">
                {% for tag in project.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
              </div>
              <h3 class="case-title">{{ project.title }}</h3>
              <p class="case-summary">{{ project.summary }}</p>
            </div>
            <span class="chevron" aria-hidden="true">&#9660;</span>
          </div>
        </button>

        <div class="accordion-content">
          <div class="case-detail">
            {% for section in project.sections %}
            <div>
              <p class="detail-label">{{ section.heading }}</p>
              <ul class="detail-list">
                {% for item in section.items %}<li>{{ item }}</li>{% endfor %}
              </ul>
            </div>
            {% endfor %}
            <div>
              <p class="detail-label">Tools &amp; Stack</p>
              <div class="tag-row">
                {% for tool in project.stack %}<span class="tag">{{ tool }}</span>{% endfor %}
              </div>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
