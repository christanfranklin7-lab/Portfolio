<section id="impact">
  <div class="wrap reveal">
    <div class="section-head">
      <p class="section-label">Measurable Results</p>
      <div class="section-rule"></div>
      <p class="section-intro">Quantified outcomes from data product delivery, reporting consolidation, and analytics leadership.</p>
    </div>

    <div class="stat-grid">
      {% for stat in site.data.stats.impact %}
      <div class="stat-cell">
        <div class="stat-figure stat-figure-lg">{% include counter.html display=stat.display count=stat.count prefix=stat.prefix suffix=stat.suffix %}</div>
        <p class="stat-caption">{{ stat.label }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
